<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Su Kalitesi İzleme Sistemi</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg1:#0a1628;--bg2:#0d2b4e;--bg3:#0a3d6b;
      --accent:#7dd3fc;--card-bg:rgba(255,255,255,0.07);
      --border:rgba(125,211,252,0.2);--text:#e2e8f0;--sub:#94a3b8;
    }
    body.light{
      --bg1:#e0f2fe;--bg2:#bae6fd;--bg3:#7dd3fc;
      --accent:#0369a1;--card-bg:rgba(255,255,255,0.7);
      --border:rgba(3,105,161,0.3);--text:#0f172a;--sub:#475569;
    }
    body{
      font-family:'Segoe UI',sans-serif;
      background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
      min-height:100vh;color:var(--text);padding:20px;
      transition:background 0.4s,color 0.4s;
    }

    /* DALGA */
    .wave-container{position:fixed;bottom:0;left:0;width:100%;z-index:0;pointer-events:none;}
    .wave-container svg{display:block;}
    .wave1{animation:wave 6s linear infinite;}
    .wave2{animation:wave 9s linear infinite reverse;opacity:0.5;}
    @keyframes wave{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}

    .content{position:relative;z-index:1;}

    /* BAŞLIK */
    .header{text-align:center;margin-bottom:24px;}
    h1{font-size:2rem;color:var(--accent);text-shadow:0 0 20px rgba(125,211,252,0.4);letter-spacing:1px;margin-bottom:4px;}
    .subtitle{color:var(--sub);font-size:0.9rem;}

    /* KONTROLLER */
    .controls{display:flex;justify-content:center;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
    .btn{
      padding:8px 18px;border-radius:999px;border:1px solid var(--border);
      background:var(--card-bg);color:var(--text);cursor:pointer;font-size:0.85rem;
      backdrop-filter:blur(10px);transition:all 0.2s;
    }
    .btn:hover{background:rgba(125,211,252,0.15);transform:translateY(-1px);}
    .btn.active{background:rgba(125,211,252,0.25);border-color:var(--accent);}

    /* ALARM BANNER */
    .alarm-banner{
      display:none;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.5);
      border-radius:12px;padding:14px 20px;text-align:center;margin-bottom:20px;
      color:#f87171;font-weight:600;font-size:1rem;animation:pulse-red 1s infinite;
    }
    .alarm-banner.show{display:block;}
    @keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4);}50%{box-shadow:0 0 0 10px rgba(239,68,68,0);}}

    /* KARTLAR */
    .cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}
    .card{
      background:var(--card-bg);border:1px solid var(--border);border-radius:16px;
      padding:20px 28px;text-align:center;min-width:170px;backdrop-filter:blur(10px);
      transition:transform 0.2s,box-shadow 0.2s,border-color 0.3s;
    }
    .card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(125,211,252,0.15);}
    .card .icon{font-size:2rem;margin-bottom:6px;}
    .card .label{font-size:0.75rem;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
    .card .value{font-size:2.2rem;font-weight:700;color:var(--accent);}
    .card .unit{font-size:0.8rem;color:var(--sub);margin-top:2px;}
    .durum-badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:0.75rem;font-weight:600;margin-top:6px;}
    .badge-iyi{background:rgba(34,197,94,0.2);color:#4ade80;}
    .badge-kotu{background:rgba(239,68,68,0.2);color:#f87171;}
    .badge-orta{background:rgba(234,179,8,0.2);color:#facc15;}
    .card.durum-iyi{border-color:rgba(34,197,94,0.4);}
    .card.durum-kotu{border-color:rgba(239,68,68,0.5);animation:pulse-red 1.5s infinite;}
    .card.durum-orta{border-color:rgba(234,179,8,0.4);}

    /* GAUGE SATIRI */
    .gauges-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}
    .gauge-box{
      background:var(--card-bg);border:1px solid var(--border);border-radius:16px;
      padding:16px;text-align:center;backdrop-filter:blur(10px);min-width:200px;
    }
    .gauge-box h3{color:var(--accent);font-size:0.9rem;margin-bottom:8px;}

    /* GRAFİK SATIRI */
    .charts-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:24px;}
    .chart-box{
      background:var(--card-bg);border:1px solid var(--border);border-radius:16px;
      padding:18px;flex:1;min-width:300px;max-width:440px;backdrop-filter:blur(10px);
    }
    .chart-box h3{color:var(--accent);font-size:0.9rem;margin-bottom:10px;text-align:center;}

    /* FOOTER */
    .footer{text-align:center;color:var(--sub);font-size:0.8rem;margin-top:16px;padding-bottom:80px;}
    .dot{display:inline-block;width:8px;height:8px;background:#4ade80;border-radius:50%;margin-right:6px;animation:blink 1.5s infinite;}
    @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
  </style>
</head>
<body>

<!-- DALGA ANİMASYONU -->
<div class="wave-container">
  <svg viewBox="0 0 1440 80" xmlns="http://www.w3.org/2000/svg" style="width:200%;">
    <path class="wave1" fill="rgba(125,211,252,0.08)" d="M0,40 C180,80 360,0 540,40 C720,80 900,0 1080,40 C1260,80 1440,0 1440,40 L1440,80 L0,80 Z"/>
  </svg>
  <svg viewBox="0 0 1440 60" xmlns="http://www.w3.org/2000/svg" style="width:200%;margin-top:-20px;">
    <path class="wave2" fill="rgba(125,211,252,0.05)" d="M0,30 C180,60 360,0 540,30 C720,60 900,0 1080,30 C1260,60 1440,0 1440,30 L1440,60 L0,60 Z"/>
  </svg>
</div>

<div class="content">
  <!-- BAŞLIK -->
  <div class="header">
    <h1>💧 Su Kalitesi İzleme Sistemi</h1>
    <p class="subtitle">Firebase Realtime Database • Canlı Veri</p>
  </div>

  <!-- KONTROLLER -->
  <div class="controls">
    <button class="btn" onclick="toggleTheme()">🌙 Tema Değiştir</button>
    <button class="btn active" id="btn1h" onclick="setRange('1h')">Son 1 Saat</button>
    <button class="btn" id="btn24h" onclick="setRange('24h')">Son 24 Saat</button>
    <button class="btn" id="btnall" onclick="setRange('all')">Tümü</button>
    <button class="btn" onclick="csvIndir()">📥 CSV İndir</button>
    <button class="btn" id="alarmBtn" onclick="toggleAlarm()">🔔 Alarm: Açık</button>
  </div>

  <!-- ALARM BANNER -->
  <div class="alarm-banner" id="alarmBanner">⚠️ <span id="alarmMesaj">Alarm!</span></div>

  <!-- KARTLAR -->
  <div class="cards">
    <div class="card" id="card-ph">
      <div class="icon">🧪</div>
      <div class="label">pH</div>
      <div class="value" id="val-ph">--</div>
      <div class="unit">pH birimi</div>
      <div id="badge-ph" class="durum-badge">--</div>
    </div>
    <div class="card" id="card-tds">
      <div class="icon">💧</div>
      <div class="label">TDS</div>
      <div class="value" id="val-tds">--</div>
      <div class="unit">ppm</div>
      <div id="badge-tds" class="durum-badge">--</div>
    </div>
    <div class="card" id="card-sic">
      <div class="icon">🌡️</div>
      <div class="label">Sıcaklık</div>
      <div class="value" id="val-sic">--</div>
      <div class="unit">°C</div>
    </div>
  </div>

  <!-- GAUGE GRAFİKLER -->
  <div class="gauges-row">
    <div class="gauge-box"><h3>pH Göstergesi</h3><div id="gauge-ph" style="height:160px;"></div></div>
    <div class="gauge-box"><h3>TDS Göstergesi</h3><div id="gauge-tds" style="height:160px;"></div></div>
    <div class="gauge-box"><h3>Sıcaklık Göstergesi</h3><div id="gauge-sic" style="height:160px;"></div></div>
  </div>

  <!-- ÇİZGİ GRAFİKLER -->
  <div class="charts-row">
    <div class="chart-box"><h3>📈 pH Geçmişi</h3><div id="chart-ph" style="height:200px;"></div></div>
    <div class="chart-box"><h3>📈 TDS Geçmişi</h3><div id="chart-tds" style="height:200px;"></div></div>
    <div class="chart-box"><h3>📈 Sıcaklık Geçmişi</h3><div id="chart-sic" style="height:200px;"></div></div>
  </div>

  <div class="footer"><span class="dot"></span>Son güncelleme: <span id="zaman">--</span></div>
</div>

<script>
  // ── Durum ────────────────────────────────────────────────────────
  let alarmAcik = true;
  let darkMode  = true;
  let aralik    = '1h';
  const MAX = 200;
  const gecmis = { ph:[], tds:[], sic:[], zaman:[] };

  // ── Firebase ─────────────────────────────────────────────────────
  const firebaseConfig = { databaseURL:"https://espiletakip-default-rtdb.firebaseio.com" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ── Google Charts ────────────────────────────────────────────────
  google.charts.load('current',{packages:['corechart','gauge']});
  google.charts.setOnLoadCallback(()=>{ chartsHazir=true; });
  let chartsHazir = false;

  // ── Yardımcılar ──────────────────────────────────────────────────
  function simdi(){ return new Date().toLocaleTimeString('tr-TR'); }

  function phDurum(v){
    if(v>=6.5&&v<=8.5) return {cls:'iyi', txt:'✓ Normal'};
    if((v>=5&&v<6.5)||(v>8.5&&v<=9.5)) return {cls:'orta',txt:'⚠ Dikkat'};
    return {cls:'kotu',txt:'✗ Tehlikeli'};
  }
  function tdsDurum(v){
    if(v<=300) return {cls:'iyi',txt:'✓ Temiz'};
    if(v<=600) return {cls:'orta',txt:'⚠ Orta'};
    return {cls:'kotu',txt:'✗ Kirli'};
  }

  function filtreliVeri(arr){
    if(aralik==='all') return arr;
    const n = aralik==='1h' ? 60 : 1440;
    return arr.slice(-Math.min(n,arr.length));
  }

  // ── Gauge ────────────────────────────────────────────────────────
  function gaugeGoster(id, deger, min, max, uyari, kritik){
    if(!chartsHazir) return;
    const data = google.visualization.arrayToDataTable([['Label','Value'],[' ',deger]]);
    const opts = {
      min,max,
      redFrom:kritik,redTo:max,
      yellowFrom:uyari,yellowTo:kritik,
      greenFrom:min,greenTo:uyari,
      width:'100%',height:160,
      majorTicks:[''+min,'',''+max],
      minorTicks:4,
      animation:{duration:800,easing:'out'}
    };
    new google.visualization.Gauge(document.getElementById(id)).draw(data,opts);
  }

  // ── Çizgi Grafik ─────────────────────────────────────────────────
  function cizgiGrafik(id, veri, renk, label){
    if(!chartsHazir||veri.length<2) return;
    const fv = filtreliVeri(veri);
    const fz = filtreliVeri(gecmis.zaman);
    const tablo = new google.visualization.DataTable();
    tablo.addColumn('string','Zaman');
    tablo.addColumn('number',label);
    fv.forEach((v,i)=>tablo.addRow([fz[i]||String(i+1),v]));
    const opts={
      backgroundColor:'transparent',legend:'none',colors:[renk],
      lineWidth:2,pointSize:3,
      chartArea:{left:40,top:10,right:10,bottom:30,width:'100%',height:'80%'},
      hAxis:{textStyle:{color:'#64748b',fontSize:9},gridlines:{color:'transparent'},showTextEvery:Math.ceil(fv.length/5)},
      vAxis:{textStyle:{color:'#94a3b8',fontSize:9},gridlines:{color:'rgba(255,255,255,0.05)'},baselineColor:'rgba(255,255,255,0.1)'},
      curveType:'function'
    };
    new google.visualization.LineChart(document.getElementById(id)).draw(tablo,opts);
  }

  // ── Alarm ────────────────────────────────────────────────────────
  let alarmSesi = null;
  function sesAl(){
    if(alarmSesi) return;
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(880,ctx.currentTime);
      osc.frequency.setValueAtTime(660,ctx.currentTime+0.2);
      osc.frequency.setValueAtTime(880,ctx.currentTime+0.4);
      gain.gain.setValueAtTime(0.3,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.6);
      osc.start(); osc.stop(ctx.currentTime+0.6);
      alarmSesi = setTimeout(()=>{ alarmSesi=null; },3000);
    }catch(e){}
  }

  function alarmKontrol(ph,tds){
    if(!alarmAcik){ document.getElementById('alarmBanner').classList.remove('show'); return; }
    const msgs=[];
    const pd=phDurum(ph); const td=tdsDurum(tds);
    if(pd.cls==='kotu') msgs.push('pH değeri tehlikeli seviyede: '+ph.toFixed(2));
    if(td.cls==='kotu') msgs.push('TDS değeri yüksek: '+tds.toFixed(1)+' ppm');
    if(msgs.length>0){
      document.getElementById('alarmMesaj').textContent='⚠️ '+msgs.join(' | ');
      document.getElementById('alarmBanner').classList.add('show');
      sesAl();
    } else {
      document.getElementById('alarmBanner').classList.remove('show');
      alarmSesi=null;
    }
  }

  // ── Ana güncelleme ────────────────────────────────────────────────
  function guncelle(ph,tds,sic){
    const t=simdi();
    document.getElementById('val-ph').textContent=parseFloat(ph).toFixed(2);
    document.getElementById('val-tds').textContent=parseFloat(tds).toFixed(1);
    document.getElementById('val-sic').textContent=parseFloat(sic).toFixed(1);
    document.getElementById('zaman').textContent=t;

    const pd=phDurum(parseFloat(ph));
    document.getElementById('badge-ph').textContent=pd.txt;
    document.getElementById('badge-ph').className='durum-badge badge-'+pd.cls;
    document.getElementById('card-ph').className='card durum-'+pd.cls;

    const td=tdsDurum(parseFloat(tds));
    document.getElementById('badge-tds').textContent=td.txt;
    document.getElementById('badge-tds').className='durum-badge badge-'+td.cls;
    document.getElementById('card-tds').className='card durum-'+td.cls;

    gecmis.ph.push(parseFloat(ph));
    gecmis.tds.push(parseFloat(tds));
    gecmis.sic.push(parseFloat(sic));
    gecmis.zaman.push(t);
    if(gecmis.ph.length>MAX){ gecmis.ph.shift();gecmis.tds.shift();gecmis.sic.shift();gecmis.zaman.shift(); }

    gaugeGoster('gauge-ph', parseFloat(ph),  0, 14, 9,  12);
    gaugeGoster('gauge-tds',parseFloat(tds), 0, 1000,300,600);
    gaugeGoster('gauge-sic',parseFloat(sic), 0, 50, 35, 45);
    cizgiGrafik('chart-ph', gecmis.ph, '#7dd3fc','pH');
    cizgiGrafik('chart-tds',gecmis.tds,'#34d399','TDS');
    cizgiGrafik('chart-sic',gecmis.sic,'#fb923c','Sıcaklık');
    alarmKontrol(parseFloat(ph),parseFloat(tds));
  }

  // ── CSV İndir ────────────────────────────────────────────────────
  function csvIndir(){
    let csv='Zaman,pH,TDS,Sicaklik\n';
    gecmis.zaman.forEach((z,i)=>{ csv+=`${z},${gecmis.ph[i]},${gecmis.tds[i]},${gecmis.sic[i]}\n`; });
    const a=document.createElement('a');
    a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
    a.download='su_kalitesi_'+new Date().toISOString().slice(0,10)+'.csv';
    a.click();
  }

  // ── Tema ─────────────────────────────────────────────────────────
  function toggleTheme(){
    darkMode=!darkMode;
    document.body.classList.toggle('light',!darkMode);
  }

  // ── Zaman aralığı ────────────────────────────────────────────────
  function setRange(r){
    aralik=r;
    ['1h','24h','all'].forEach(x=>document.getElementById('btn'+x).classList.remove('active'));
    document.getElementById('btn'+r).classList.add('active');
    cizgiGrafik('chart-ph', gecmis.ph, '#7dd3fc','pH');
    cizgiGrafik('chart-tds',gecmis.tds,'#34d399','TDS');
    cizgiGrafik('chart-sic',gecmis.sic,'#fb923c','Sıcaklık');
  }

  // ── Alarm toggle ─────────────────────────────────────────────────
  function toggleAlarm(){
    alarmAcik=!alarmAcik;
    document.getElementById('alarmBtn').textContent=alarmAcik?'🔔 Alarm: Açık':'🔕 Alarm: Kapalı';
    if(!alarmAcik) document.getElementById('alarmBanner').classList.remove('show');
  }

  // ── Firebase dinleyici ───────────────────────────────────────────
  db.ref('su_kalitesi').on('value',snap=>{
    const d=snap.val();
    if(d&&d.pH!==undefined&&d.TDS!==undefined&&d.Sicaklik!==undefined){
      guncelle(d.pH,d.TDS,d.Sicaklik);
    }
  });
</script>
</body>
</html>
